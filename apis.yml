aid: abderatherapeutics
name: Abdera Therapeutics
description: >-
  Abdera Therapeutics is a clinical-stage biopharmaceutical company headquartered in South San
  Francisco, California, with research operations in Vancouver, British Columbia. It was launched in
  2021 out of adMare BioInnovations with AbCellera as a founding partner and has raised roughly $148
  million from investors including Versant Ventures, Foresite Capital, Johnson & Johnson Innovation
  (JJDC), Qiming Venture Partners USA, RTW Investments and venBio. The company engineers precision
  radiopharmaceuticals for solid tumours on its proprietary Radio Optimized Vector Engineering
  (ROVEr) platform, which pairs antibody-derived targeting vectors with potent alpha-emitting
  radioisotopes such as actinium-225. Its lead candidate, ABD-147, targets delta-like ligand 3
  (DLL3) and is in a Phase 1 trial (NCT06736418) in small cell lung cancer and large cell
  neuroendocrine carcinoma under FDA Fast Track designation; a second program, ABD-320, targets 5T4.
  Abdera's product is a drug candidate, not software. It runs no developer program and publishes no
  API, developer portal, API reference, SDK, or machine-readable specification of any kind. As of
  2026-09-06 the company's own corporate site at www.abderatx.com was additionally unreachable,
  returning a Flywheel "Unknown Domain" host error on every path behind a TLS certificate that
  expired on 2026-07-19.
